sentence=GUI framework for 128x64 monochrome OLEDs: focus navigation, layer stack, spring animation.
paragraph=Spring-driven animation, a layer stack, focus navigation and a small widget set. Display and input backends live in their own folders, so porting to another screen or another set of keys means adding one file each and leaving the core untouched. C++ rewrite of the lilt project by chhongzh (https://github.com/chhongzh/lilt).
