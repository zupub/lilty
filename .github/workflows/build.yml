name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      # core/ must build and behave with no Arduino anywhere in sight.
      - run: pio test -e native

  examples:
    name: example ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - minimal
          - esp32s3-sh1106-rotary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'examples/*/platformio.ini') }}
      - run: pip install platformio
      # An example that no longer compiles is the first sign a rename or an API
      # change broke somebody's port.
      - run: pio run -d examples/${{ matrix.example }}
