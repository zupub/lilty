; Tests and examples for the lilty library itself.
;
;   pio test -e native                  run the desktop unit tests
;   pio run -d examples/minimal         build one of the examples
;
; The examples are separate PlatformIO projects (they have their own
; platformio.ini), so this file only exists to give `pio test` an environment.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity

; Compile src/ into the test binary, but skip the two hardware backends --
; they pull in <Arduino.h> and <Wire.h>, and the whole point of this env is
; to prove that core/ needs neither.
test_build_src = yes
build_src_filter = +<*> -<display/> -<input/>

; So the tests can #include "lilty.h" the same way a sketch does.
build_flags = -I src
