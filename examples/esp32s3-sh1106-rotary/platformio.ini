; ESP32-S3-DevKitC-1 + SH1106 128x64 (I2C) + rotary encoder
;
; Build:  pio run -d examples/esp32s3-sh1106-rotary
; Flash:  pio run -d examples/esp32s3-sh1106-rotary -t upload
; Watch:  pio device monitor -b 115200

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Uncomment if your board carries an 8 MB OPI PSRAM part.
; board_build.arduino.memory_type = qio_opi

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Point back at the library root so edits to src/ are picked up without
; reinstalling. Drop this line once lilty is in the PlatformIO registry.
lib_deps = symlink://../..
