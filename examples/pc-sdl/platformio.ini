; 桌面预览：同一套界面代码跑在 SDL2 窗口里，不用接板子。
;
;   pio run -d examples/pc-sdl
;   .pio/build/pc_sdl/program           （Windows 上是 program.exe）
;
; 需要装 SDL2 的开发文件，因为 gfx_sdl.cpp 要 #include <SDL2/SDL.h>：
;   MSYS2          pacman -S mingw-w64-x86_64-SDL2
;   Debian/Ubuntu  sudo apt install libsdl2-dev
;   macOS          brew install sdl2
;
; LILTY_SDL 是打开 SDL 后端的开关。不定义它时库完全不依赖 SDL，所以 ESP32
; 的两个示例和 pio test -e native 在没有装 SDL 的机器上照样能编译。

[env:pc_sdl]
platform = native

lib_deps = symlink://../..

build_flags =
    -D LILTY_SDL
    ; SDL2 在 Windows 上会把 main 改名成 SDL_main 并索要 WinMain，得靠
    ; SDL2main 补上。这里干脆关掉那套机制，自己写的 main 就还是 main，
    ; 于是 Windows / Linux / macOS 用同一份链接参数。
    -D SDL_MAIN_HANDLED
    -lSDL2
